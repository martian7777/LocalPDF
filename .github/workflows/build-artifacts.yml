name: Build & Publish Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to Generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk_debug
          - apk_release
          - bundle_aab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks-and-bundle:
    name: Build APKs & App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk_debug' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' }}
        run: ./gradlew assembleDebug || true

      # 2. Build Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk_release' || startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleRelease || true

      # 3. Build Release Android App Bundle (AAB)
      - name: Build Release AAB
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'bundle_aab' || startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew bundleRelease || true

      # 4. Upload Debug APK Artifacts
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-Debug-APKs
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      # 5. Upload Release APK Artifacts
      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-Release-APKs
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # 6. Upload Release AAB (Android App Bundle) Artifacts
      - name: Upload Release App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-Release-AAB
          path: |
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # 7. Create Draft Release on GitHub for Tags
      - name: Publish Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
