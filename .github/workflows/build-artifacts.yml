name: Build & Publish Artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: Build output
        required: true
        default: all
        type: choice
        options: [all, apk_debug, apk_release, bundle_aab]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ github.event_name == 'push' && 'all' || inputs.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        if: env.BUILD_TYPE == 'all' || env.BUILD_TYPE == 'apk_debug'
        run: ./gradlew :app:assembleDebug

      - name: Validate release signing secrets
        if: env.BUILD_TYPE == 'all' || env.BUILD_TYPE == 'apk_release' || env.BUILD_TYPE == 'bundle_aab'
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCALPDF_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOCALPDF_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LOCALPDF_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing LOCALPDF_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing LOCALPDF_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing LOCALPDF_KEY_PASSWORD"; exit 1; }

      - name: Restore external production keystore
        if: env.BUILD_TYPE == 'all' || env.BUILD_TYPE == 'apk_release' || env.BUILD_TYPE == 'bundle_aab'
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCALPDF_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/localpdf-release.jks"
          chmod 600 "$RUNNER_TEMP/localpdf-release.jks"

      - name: Build signed release APK and AAB
        if: env.BUILD_TYPE == 'all'
        env:
          LOCALPDF_KEYSTORE_PATH: ${{ runner.temp }}/localpdf-release.jks
          LOCALPDF_KEYSTORE_PASSWORD: ${{ secrets.LOCALPDF_KEYSTORE_PASSWORD }}
          LOCALPDF_KEY_PASSWORD: ${{ secrets.LOCALPDF_KEY_PASSWORD }}
          LOCALPDF_KEY_ALIAS: ${{ secrets.LOCALPDF_KEY_ALIAS || 'localpdf-release' }}
        run: ./gradlew :app:collectReleaseArtifacts

      - name: Build signed release APK
        if: env.BUILD_TYPE == 'apk_release'
        env:
          LOCALPDF_KEYSTORE_PATH: ${{ runner.temp }}/localpdf-release.jks
          LOCALPDF_KEYSTORE_PASSWORD: ${{ secrets.LOCALPDF_KEYSTORE_PASSWORD }}
          LOCALPDF_KEY_PASSWORD: ${{ secrets.LOCALPDF_KEY_PASSWORD }}
          LOCALPDF_KEY_ALIAS: ${{ secrets.LOCALPDF_KEY_ALIAS || 'localpdf-release' }}
        run: ./gradlew :app:assembleRelease

      - name: Build signed release AAB
        if: env.BUILD_TYPE == 'bundle_aab'
        env:
          LOCALPDF_KEYSTORE_PATH: ${{ runner.temp }}/localpdf-release.jks
          LOCALPDF_KEYSTORE_PASSWORD: ${{ secrets.LOCALPDF_KEYSTORE_PASSWORD }}
          LOCALPDF_KEY_PASSWORD: ${{ secrets.LOCALPDF_KEY_PASSWORD }}
          LOCALPDF_KEY_ALIAS: ${{ secrets.LOCALPDF_KEY_ALIAS || 'localpdf-release' }}
        run: ./gradlew :app:bundleRelease

      - name: Stage and checksum outputs
        id: stage
        shell: bash
        run: |
          mkdir -p artifacts
          case "$BUILD_TYPE" in
            all)
              cp app/build/outputs/apk/debug/app-debug.apk artifacts/localpdf-0.1.0-debug.apk
              cp app/build/outputs/release/localpdf-0.1.0-universal-release.apk artifacts/
              cp app/build/outputs/release/localpdf-0.1.0-release.aab artifacts/
              ;;
            apk_debug)
              cp app/build/outputs/apk/debug/app-debug.apk artifacts/localpdf-0.1.0-debug.apk
              ;;
            apk_release)
              cp app/build/outputs/apk/release/app-release.apk artifacts/localpdf-0.1.0-universal-release.apk
              ;;
            bundle_aab)
              cp app/build/outputs/bundle/release/app-release.aab artifacts/localpdf-0.1.0-release.aab
              ;;
          esac
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)" || { echo "No APK or AAB was produced"; exit 1; }
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          echo "count=$(find artifacts -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload APK and AAB
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-${{ github.ref_name }}-${{ env.BUILD_TYPE }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## LocalPDF Android artifacts"
            echo
            echo "- Build type: \`$BUILD_TYPE\`"
            echo "- Commit: \`${GITHUB_SHA::12}\`"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- Download: [LocalPDF APK/AAB artifact]($ARTIFACT_URL)"
            else
              echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            fi
            echo
            if [ -f artifacts/SHA256SUMS.txt ]; then
              echo "### SHA-256"
              echo '```text'
              cat artifacts/SHA256SUMS.txt
              echo '```'
            else
              echo "> No artifacts were produced. Check the failed build or signing step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach artifacts to tagged GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
